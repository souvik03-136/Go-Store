# Taskfile.yml
version: '3'

tasks:
  build:
    desc: "Build the Go binary to bin/api"
    cmds:
      - go build -o bin/api ./cmd/api

  run:
    desc: "Run the application (reads .env automatically)"
    cmds:
      - go run ./cmd/api

  test:
    desc: "Run all tests with race detector"
    cmds:
      - go test -race -count=1 ./...

  test:cover:
    desc: "Run tests and open an HTML coverage report"
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - open coverage.html

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: "Format all Go source files"
    cmds:
      - gofmt -w .

  vet:
    desc: "Run go vet"
    cmds:
      - go vet ./...

  migrate:up:
    desc: "Apply all pending database migrations"
    cmds:
      - ./scripts/migrate.sh up

  migrate:down:
    desc: "Roll back the last migration"
    cmds:
      - ./scripts/migrate.sh rollback

  docker:build:
    desc: "Build the Docker image"
    cmds:
      - docker build -t go-store:latest .

  docker:up:
    desc: "Start all services with Docker Compose"
    cmds:
      - docker compose up --build

  docker:down:
    desc: "Stop and remove all Docker Compose containers"
    cmds:
      - docker compose down --remove-orphans

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf bin/ coverage.out coverage.html